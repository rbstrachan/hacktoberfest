<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrassCheck - Touch Grass Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';
    
    let classifier;
    const statusEl = document.getElementById('status');
    const analyzeBtn = document.getElementById('analyzeBtn');

    async function loadModel() {
      try {
        statusEl.innerText = "Loading open-source AI model into browser memory...";
        classifier = await pipeline('image-classification', 'Xenova/mobilevit-small');
        statusEl.innerText = "Ready! Model loaded locally in your browser.";
        analyzeBtn.disabled = false;
      } catch (err) {
        statusEl.innerText = "Error loading model. Check internet on initial load.";
      }
    }
    loadModel();

    window.analyzeImage = async function() {
      const fileInput = document.getElementById('imageInput');
      const resultEl = document.getElementById('result');
      
      if (!fileInput.files[0]) {
        alert("Please upload a photo first!");
        return;
      }

      statusEl.innerText = "Analyzing locally with open-source MobileViT...";
      resultEl.innerHTML = "";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const imageSrc = e.target.result;
        document.getElementById('preview').src = imageSrc;
        document.getElementById('previewContainer').classList.remove('hidden');

        const output = await classifier(imageSrc);
        
        statusEl.innerText = "Analysis Complete!";
        let topResult = output[0];
        
        resultEl.innerHTML = `
          <div class="p-4 bg-emerald-50 rounded-lg border border-emerald-200 mt-4">
            <h3 class="font-bold text-lg text-emerald-800">Local AI Detection Results:</h3>
            <p class="text-gray-700 mt-1">Primary Match: <strong>${topResult.label}</strong> (${(topResult.score * 100).toFixed(1)}% confidence)</p>
            <p class="text-sm text-gray-500 mt-2">✨ Processed 100% locally in your browser using MobileViT.</p>
          </div>
        `;
      };
      reader.readAsDataURL(file);
    };

    const tasks = [
      "Step outside and take a photo of a green plant or grass.",
      "Find a tree leaf with interesting textures or colors.",
      "Look up! Take a photo of the sky, clouds, or tree canopy.",
      "Find an outdoor object made of wood or stone."
    ];

    window.getNewTask = function() {
      const randomTask = tasks[Math.floor(Math.random() * tasks.length)];
      document.getElementById('taskDisplay').innerText = randomTask;
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
    <div class="text-center mb-6">
      <span class="text-4xl">🌱</span>
      <h1 class="text-2xl font-bold text-slate-800">GrassCheck</h1>
      <p class="text-sm text-slate-500 mt-1">Open-Source Local AI Proof-of-Outdoor Task</p>
    </div>

    <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 mb-6 text-center">
      <span class="text-xs font-semibold text-amber-800 uppercase tracking-wider">Your Grass Task</span>
      <p id="taskDisplay" class="font-medium text-slate-800 mt-1">Step outside and take a photo of a green plant or grass.</p>
      <button onclick="getNewTask()" class="mt-3 text-xs text-amber-700 underline font-semibold">Get Another Task</button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Upload Photo Proof:</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
      </div>

      <button id="analyzeBtn" disabled onclick="analyzeImage()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold rounded-xl shadow transition duration-200">
        Verify Outdoor Photo
      </button>
    </div>

    <div id="status" class="text-xs text-center text-slate-400 mt-4">Initializing...</div>
    
    <div id="previewContainer" class="hidden mt-4">
      <img id="preview" class="w-full h-48 object-cover rounded-lg border">
    </div>
    
    <div id="result"></div>
  </div>
</body>
</html>
